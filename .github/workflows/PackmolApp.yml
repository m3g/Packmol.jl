name: packmol app
on:
  workflow_dispatch:
  # Also on pull requests that change the command line app or its dependencies
  pull_request:
    paths:
      - 'src/CLI.jl'
      - 'Project.toml'
      - '.github/workflows/PackmolApp.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test-app:
    # This exercises `Pkg.Apps`-installing and running the `packmol` command
    # line app, which runs the native Julia implementation (see src/CLI.jl).
    # Kept in its own workflow, separate from CI.yml, since it is slow (the app
    # environment is instantiated and precompiled from scratch).
    name: packmol app - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          # Pkg.Apps requires Julia 1.12+.
          version: '1'
      - uses: julia-actions/cache@v3
      # The input of the water and urea tutorial (its structure files are in the
      # repository); the output goes to the runner's temporary directory.
      - name: install and run packmol app (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          julia -e 'import Pkg; Pkg.Apps.develop(path=".")'
          juliabin=`julia -e 'print(joinpath(Base.DEPOT_PATH[1],"bin"))'`
          $juliabin/packmol --version
          $juliabin/packmol -i docs/src/tutorials/files/mixture/mixture.inp -o "$RUNNER_TEMP/mixture.pdb" -s 1
          test -s "$RUNNER_TEMP/mixture.pdb"
      - name: install and run packmol app (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          julia -e 'import Pkg; Pkg.Apps.develop(path=".")'
          $juliabin = julia -e 'print(joinpath(Base.DEPOT_PATH[1],"bin"))'
          & "$juliabin\packmol" --version
          & "$juliabin\packmol" -i docs\src\tutorials\files\mixture\mixture.inp -o "$env:RUNNER_TEMP\mixture.pdb" -s 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:RUNNER_TEMP\mixture.pdb")) { exit 1 }
