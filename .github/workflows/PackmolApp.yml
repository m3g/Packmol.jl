name: packmol app
on:
  workflow_dispatch:
  # Also on pull requests that change the command line app or its dependencies
  pull_request:
    paths:
      - 'src/CLI.jl'
      - 'Project.toml'
      - '.github/workflows/PackmolApp.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test-app:
    # This exercises `Pkg.Apps`-installing and running the `packmol` command
    # line app, which runs the native Julia implementation (see src/CLI.jl).
    # Kept in its own workflow, separate from CI.yml, since it is slow (the app
    # environment is instantiated and precompiled from scratch).
    name: packmol app - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          # Pkg.Apps requires Julia 1.12+.
          version: '1'
      - uses: julia-actions/cache@v3
      # The input of the water and urea tutorial, with the structure files of the tutorials
      # (the packmol_tutorials set of MolSimTestFiles), in the runner's temporary directory.
      - name: install and run packmol app (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          julia -e 'import Pkg; Pkg.Apps.develop(path=".")'
          juliabin=`julia -e 'print(joinpath(Base.DEPOT_PATH[1],"bin"))'`
          $juliabin/packmol --version
          mkdir -p "$RUNNER_TEMP/mixture"
          curl -sSL https://github.com/m3g/MolSimTestFiles/releases/download/packmol_tutorials-v1/packmol_tutorials.tar.gz | tar xz -C "$RUNNER_TEMP/mixture"
          cp docs/src/tutorials/files/mixture/mixture.inp "$RUNNER_TEMP/mixture/"
          $juliabin/packmol -i "$RUNNER_TEMP/mixture/mixture.inp" -o "$RUNNER_TEMP/mixture.pdb" -s 1
          test -s "$RUNNER_TEMP/mixture.pdb"
      - name: install and run packmol app (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          julia -e 'import Pkg; Pkg.Apps.develop(path=".")'
          $juliabin = julia -e 'print(joinpath(Base.DEPOT_PATH[1],"bin"))'
          & "$juliabin\packmol" --version
          $dir = Join-Path $env:RUNNER_TEMP "mixture"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri "https://github.com/m3g/MolSimTestFiles/releases/download/packmol_tutorials-v1/packmol_tutorials.tar.gz" -OutFile (Join-Path $env:RUNNER_TEMP "packmol_tutorials.tar.gz")
          tar -xzf (Join-Path $env:RUNNER_TEMP "packmol_tutorials.tar.gz") -C $dir
          Copy-Item docs\src\tutorials\files\mixture\mixture.inp $dir
          & "$juliabin\packmol" -i (Join-Path $dir "mixture.inp") -o "$env:RUNNER_TEMP\mixture.pdb" -s 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:RUNNER_TEMP\mixture.pdb")) { exit 1 }
