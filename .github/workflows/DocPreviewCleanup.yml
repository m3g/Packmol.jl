name: Doc preview cleanup
# Deletes the docs preview of a pull request (previews/PR<number> in gh-pages,
# published by deploydocs with push_preview = true) when the pull request is closed.
on:
  pull_request:
    types: [closed]
concurrency:
  group: doc-preview-cleanup
  cancel-in-progress: false
jobs:
  doc-preview-cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
      - name: delete the preview
        env:
          preview_dir: previews/PR${{ github.event.number }}
        run: |
          if [ -d "$preview_dir" ]; then
            git config user.name "Documenter.jl"
            git config user.email "documenter@juliadocs.github.io"
            git rm -rf -q "$preview_dir"
            git commit -m "Delete the docs preview of PR ${{ github.event.number }}"
            git push origin gh-pages
          fi
